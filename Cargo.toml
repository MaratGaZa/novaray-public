[package]
name = "novaray-core"
version = "0.1.0"
edition = "2021"
authors = ["NovaRay Team"]
description = "Modern High-Performance VLESS/Reality VPN Client & Split-Tunneling Engine"
license = "GPL-3.0-or-later"

[lib]
name = "novaray_core"
path = "src/lib.rs"

[[bin]]
name = "novaray-core"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
bytes = "1.7"
libc = "0.2"
url = "2.5"
percent-encoding = "2.3"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.29", features = ["net", "process"] }

[dev-dependencies]
jsonschema = "0.28"
